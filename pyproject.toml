[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specguard"
version = "0.1.0"
description = "Requirement-aware mutation testing for Python services"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
aws = ["boto3>=1.34"]
backend = ["fastapi>=0.100", "uvicorn>=0.23", "python-multipart>=0.0.6"]
dev = ["pytest>=8"]

[project.scripts]
specguard = "specguard.cli:main"

[tool.setuptools.packages.find]
include = ["specguard*", "demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
